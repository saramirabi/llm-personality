# Pre-specified measurement plan. Do not edit this file after results exist.
# SHA-256 of this file is recorded in every result file.

seed: 20261002
bootstrap_resamples: 2000
group_kfold_splits: 5
length_control_words: 12
chance_six: 0.16666666666666666
chance_five: 0.2

packages:
  scispacy: "0.5.5"
  en_core_sci_sm: "0.5.4"
  spacy: "3.7.5"
  sentence_transformers: "3.4.1"
  sentence_transformer_model: "sentence-transformers/all-MiniLM-L6-v2"
  numpy: "1.26.4"
  scikit_learn: "1.5.2"
  statsmodels: "0.14.4"

tfidf:
  ngram_range: [1, 2]
  min_df: 3
  sublinear_tf: true

logistic:
  max_iter: 2000
  C: 5

stopwords: "sklearn.feature_extraction.text.ENGLISH_STOP_WORDS"
gee_cov_struct: "Exchangeable"
gee_position_reference: "Early"
gee_condition_reference: "P0"
cosine_distance: "one_minus_cosine_similarity"
b4_impute: "median_within_training_fold"
# A6 is a distance to the labelled P0 response, so it is not a classifier feature.
b4_exclude_features: [persona_distance]
# Sentences are spans split on . ! or ?, with the delimiter kept on the span.
sentence_split: "delimiter_dot_exclamation_question"
# The written rule strips the filler "so" before testing "so you", so that
# leading-question clause cannot match. It is implemented as written.

fillers:
  - "ok"
  - "okay"
  - "alright"
  - "all right"
  - "right"
  - "so"
  - "and"
  - "um"
  - "uh"
  - "well"
  - "now"
  - "yeah"
  - "yes"
  - "no"
  - "i see"
  - "got it"

question_closed_quantity:
  - "how many"
  - "how much"
  - "how long"
  - "how often"

question_open:
  - "what"
  - "how"
  - "why"
  - "tell me"
  - "describe"
  - "can you tell me"
  - "could you tell me"
  - "can you describe"
  - "could you describe"
  - "walk me through"
  - "talk me through"
  - "what about"
  - "how about"
  - "explain"

question_closed:
  - "do"
  - "does"
  - "did"
  - "is"
  - "are"
  - "was"
  - "were"
  - "have"
  - "has"
  - "had"
  - "can"
  - "could"
  - "will"
  - "would"
  - "should"
  - "any"
  - "are there"
  - "is there"
  - "has there"
  - "have there"
  - "when"
  - "where"
  - "who"
  - "which"

leading_endings:
  - ", right?"
  - ", correct?"
  - "is that right?"
  - "is that correct?"
  - "isn't it?"
  - "don't you?"
  - "haven't you?"
  - "didn't you?"

lexicons:
  emotion:
    prefix: [feel, worr, anxi, stress, fear, frighten, depress, frustrat, overwhelm, distress, emotion]
    exact: [felt, scared, afraid, upset, sad, nervous, cope, coping, mood, lonely, angry, hopeless]
  life_context:
    prefix: [work, famil, friend, support, relationship, hobb, financ]
    exact: [job, home, school, daily, day-to-day, routine, life, living, partner, wife, husband, spouse, kids, children, activities, money, carer, caring]
  empathy_phrases:
    prefix: [understandabl]
    phrases:
      - "i'm sorry"
      - "sorry to hear"
      - "that sounds"
      - "that must be"
      - "i understand"
      - "i can understand"
      - "i can imagine"
      - "i can see"
      - "thank you for sharing"
      - "thanks for sharing"
      - "i appreciate"
      - "must be difficult"
      - "must be hard"
      - "that's tough"
      - "that's difficult"
      - "i hear you"
  instruction:
    phrases:
      - "you need to"
      - "you must"
      - "you have to"
      - "you should"
      - "i need you to"
      - "i want you to"
      - "make sure you"
      - "you are to"
      - "you will need to"
  plan_statement:
    phrases:
      - "we will"
      - "we'll"
      - "we are going to"
      - "we're going to"
      - "i will"
      - "i'll"
      - "i am going to"
      - "i'm going to"
      - "i would like to order"
      - "i'd like to order"
  invitation:
    phrases:
      - "what do you think"
      - "how do you feel about"
      - "is there anything else"
      - "anything you'd like"
      - "anything you would like"
      - "would you like"
      - "what would you like"
      - "what matters"
      - "your thoughts"
      - "do you have any questions"
      - "tell me more"
      - "in your own words"
      - "what is most"
      - "what's most"
      - "we can decide"
      - "your preference"
      - "your preferences"
      - "what worries you"
  hedge:
    exact: [maybe, perhaps, might, possibly]
    phrases:
      - "could be"
      - "i think"
      - "sort of"
      - "kind of"
      - "a bit"
      - "i wonder"

predictions:
  - contrast: [P1, P0]
    marker: psychosocial_per_100
    direction: lower
  - contrast: [P1, P0]
    marker: med_per_100
    direction: higher
  - contrast: [P1, P0]
    marker: share_open
    direction: lower
  - contrast: [P2, P1]
    marker: psychosocial_per_100
    direction: higher
  - contrast: [P3, P0]
    marker: psychosocial_per_100
    direction: higher
  - contrast: [P3, P0]
    marker: share_open
    direction: higher
  - contrast: [P4, P0]
    marker: psychosocial_per_100
    direction: higher
  - contrast: [P4, P0]
    marker: share_open
    direction: higher
  - contrast: [P4, P0]
    marker: med_per_100
    direction: lower
  - contrast: [P4, P3]
    marker: psychosocial_per_100
    direction: higher
  - contrast: [P4, P3]
    marker: med_per_100
    direction: lower
  - contrast: [P5, P0]
    marker: instruction_per_100
    direction: higher
  - contrast: [P5, P0]
    marker: n_leading
    direction: higher
  - contrast: [P5, P0]
    marker: invitation_per_100
    direction: lower
  - contrast: [P5, P0]
    marker: share_open
    direction: lower
  - contrast: [P5, P0]
    marker: has_question
    direction: lower
    erratum: 2
  - contrast: [P5, P0]
    marker: plan_statement_present
    direction: higher
    erratum: 2

format_flags:
  - flag_empty
  - flag_truncated
  - flag_patient_turn
  - flag_multiple_doctor_turns
  - flag_refusal_or_ai_meta

# Erratum 1 is a reporting correction. No measure, word list, or setting above is changed.
errata:
  - id: 1
    date: "2026-10-02"
    original_plan_sha256: "2fde5453edf8a2674b83db5a74d26b22e7dae48edd3ac45cea70819112df5cf4"
    change: "A persona with zero pre-specified predictions against P0 is reported as not assessed, not as realised. The realised tables add an assessment column."
  - id: 2
    date: "2026-10-02"
    original_plan_sha256: "2fde5453edf8a2674b83db5a74d26b22e7dae48edd3ac45cea70819112df5cf4"
    plan_sha256_before_this_erratum: "56679285fb538ddfe04723dfadca09a1a34418ff6ba766cc55fa559c86675cc6"
    exploratory_models: [gemini, claude]
    change: "Two P5 versus P0 predictions were added after the Gemini and Claude results were seen: has_question lower, and plan_statement presence higher. They use the same paired difference from P0, cluster bootstrap, overall and by position, and Late minus Early test. They are labelled exploratory for gemini and claude, and pre-specified for any model run after 2026-10-02. They are not part of the realised rule. No earlier rule, word list, or setting is changed."
  - id: 4
    date: "2026-10-02"
    original_plan_sha256: "2fde5453edf8a2674b83db5a74d26b22e7dae48edd3ac45cea70819112df5cf4"
    plan_sha256_before_erratum_2: "56679285fb538ddfe04723dfadca09a1a34418ff6ba766cc55fa559c86675cc6"
    plan_sha256_before_this_erratum: "c1747f993babaa05f8dd3c99543584d8555cb9212138a92e909972505a210450"
    descriptive_addition_date: "2026-10-02"
    descriptive_addition_plan_sha256_before: "6824e3b29150267399c5395c102cece104505641076ae0e86d93fb29689945b4"
    descriptive_addition: "exact_repeat is a descriptive flag on the cleaned rollout table. It is 1 when a doctor turn is identical to the previous doctor turn in the same rollout after trimming whitespace, and 0 otherwise. Turn 1 is 0. Rollout reports give this flag by condition and turn. No other rule, word list, or setting is changed."
    change: "Analysis of the rollouts. For each doctor model, train the Experiment 1 classifier, with the same settings as B1, on that model's Experiment 1 outputs from the 218 dialogues that are not in the rollout subset, and apply it to doctor turns 1 to 4 of the rollouts. Report accuracy and recall per condition at each turn, overall and by starting position, with 95% intervals from a cluster bootstrap over dialogues using 2,000 resamples. Persistence test: the difference in accuracy, and in recall per condition, between turn 4 and turn 1, paired by rollout, with the same bootstrap. The prediction is that recognition of the assigned condition is lower at turn 4. Repeat the accuracy, recall, and persistence reports using only the first 12 words of each doctor turn. Compute the Part A features for every doctor turn. For each marker and persona, report the paired difference from the P0 rollout of the same context at each turn, and the turn 4 minus turn 1 change of that difference, with the same bootstrap. Include the existing directional predictions and the two P5 predictions from erratum 2. Descriptive tables: doctor turn length, has_question, plan_statement and closing_detected by condition and turn; patient reply length by condition and turn. Reports must state that from turn 2 onward the conversations differ between conditions, so differences reflect the persona together with the conversation it produced. No earlier rule, word list, or setting is changed."
  - id: 5
    date: "2026-10-05"
    plan_sha256_before_this_erratum: "7b85c86fc37013b4e42e3a46c77bdef4cf6073171add570ca9879b7f7c896455"
    change: "Post hoc robustness analysis, specified on 2026-10-05 after the Experiment 1 results were known. Experiment 1 (OSCE) outputs of gemini, claude and gpt are truncated after the patient-label rule to (T25) the first 25 whitespace-separated words and (T1S) the first sentence from measure_text.sentences. The existing measurement code is rerun unchanged on full text, T25 and T1S. Reported: lengths, prediction verdicts, realised personas, within-model and held-out-model accuracy, baseline psychosocial rate, and lexicon markers as binary presence. Script and tables are in analysis/length_matched/. No earlier rule, word list, setting or result is changed."
  - id: 6
    date: "2026-10-05"
    plan_sha256_before_this_erratum: "01f67a5b0a8fa45deb692ceaea5f1420b7778b9cdfffc9808a6b91cde966e322"
    change: "Post hoc external validation, specified on 2026-10-05 after the Experiment 1 results were known. The Experiment 1 (OSCE) outputs of gemini, claude, gpt, llama2chat and medgemma (analysis_text, full text and first 25 whitespace-separated words) are scored with Empath built-in categories and ConvoKit politeness strategies, using the mapping fixed in analysis/external_validation/prespec_mapping.md before scoring. Reported: Spearman convergence with the existing markers, replication of selected directional predictions with the external measures, agreement with the original verdicts, and Empath per-category differences, with the existing cluster bootstrap. Script and tables are in analysis/external_validation/. No earlier rule, word list, setting or result is changed."
  - id: 7
    date: "2026-10-08"
    plan_sha256_before_this_erratum: "e33bdf0004f1e97aa30a4e8dd1a124f1bc20586c4104f7eeb9d3434654cfff73"
    change: "Post hoc within-family comparison, specified on 2026-10-08 after the results of llama3instruct and biomedllama were known. Both models received identical prompts. For every directional prediction, the per-context persona effects of the two models are differenced and the difference is bootstrapped over dialogues with the existing cluster bootstrap (OSCE and ACI-Bench); classifier correctness is compared pairwise on the same context and condition; baseline (P0) markers and rollout persona effects by turn are compared in the same way. Script and tables are in analysis/family_comparison/. The models also differ in quantization (Q2_K versus Q4_K_S). No earlier rule, word list, setting or result is changed."
